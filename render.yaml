services:
  - type: web
    name: xueshan-notes-library
    runtime: python
    plan: free
    rootDir: dynamic-notes
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /tmp/xueshan-notes-data
      - key: ADMIN_USERNAME
        value: xueshan
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
