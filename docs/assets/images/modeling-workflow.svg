<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">数学建模六步工作流</title>
  <desc id="desc">从题意翻译、数据整理、模型建立、求解、验证到论文表达的六步流程图。</desc>
  <rect width="1200" height="340" rx="24" fill="#f7f2e8"/>
  <path d="M70 175H1130" fill="none" stroke="#9bb8a5" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(48 82)">
      <rect width="160" height="150" rx="18" fill="#244b45"/>
      <text x="80" y="48" fill="#d99b4c" font-size="18" font-weight="700">01</text>
      <text x="80" y="86" fill="#fff" font-size="22" font-weight="700">读题翻译</text>
      <text x="80" y="116" fill="#d8ebe0" font-size="14">输出、变量、约束</text>
    </g>
    <g transform="translate(236 82)">
      <rect width="160" height="150" rx="18" fill="#357266"/>
      <text x="80" y="48" fill="#f5c273" font-size="18" font-weight="700">02</text>
      <text x="80" y="86" fill="#fff" font-size="22" font-weight="700">整理数据</text>
      <text x="80" y="116" fill="#e5f0e8" font-size="14">来源、缺失、单位</text>
    </g>
    <g transform="translate(424 82)">
      <rect width="160" height="150" rx="18" fill="#718f75"/>
      <text x="80" y="48" fill="#fff3d5" font-size="18" font-weight="700">03</text>
      <text x="80" y="86" fill="#fff" font-size="22" font-weight="700">建立模型</text>
      <text x="80" y="116" fill="#f4f7ed" font-size="14">目标、假设、方程</text>
    </g>
    <g transform="translate(612 82)">
      <rect width="160" height="150" rx="18" fill="#b57b35"/>
      <text x="80" y="48" fill="#fff2cf" font-size="18" font-weight="700">04</text>
      <text x="80" y="86" fill="#fff" font-size="22" font-weight="700">求解实现</text>
      <text x="80" y="116" fill="#fff4dc" font-size="14">算法、参数、代码</text>
    </g>
    <g transform="translate(800 82)">
      <rect width="160" height="150" rx="18" fill="#4f7f70"/>
      <text x="80" y="48" fill="#f5c273" font-size="18" font-weight="700">05</text>
      <text x="80" y="86" fill="#fff" font-size="22" font-weight="700">验证稳健</text>
      <text x="80" y="116" fill="#e5f0e8" font-size="14">基线、敏感性、边界</text>
    </g>
    <g transform="translate(988 82)">
      <rect width="160" height="150" rx="18" fill="#244b45"/>
      <text x="80" y="48" fill="#d99b4c" font-size="18" font-weight="700">06</text>
      <text x="80" y="86" fill="#fff" font-size="22" font-weight="700">表达复盘</text>
      <text x="80" y="116" fill="#d8ebe0" font-size="14">图表、结论、局限</text>
    </g>
  </g>
  <text x="600" y="292" text-anchor="middle" fill="#64716a" font-family="Microsoft YaHei, sans-serif" font-size="16">每完成一问，留下可复核的输入、输出和证据</text>
</svg>
