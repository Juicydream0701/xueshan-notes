<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img"><title>换路后戴维南电源经电阻向电容充电</title><rect width="100%" height="100%" fill="#fbfaf5" rx="12"/><circle cx="150" cy="180" r="25" stroke="#274d43" fill="none" stroke-width="2.5"/><path d="M150,130 v25 M150,205 v25" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="175" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">+</text><text x="150" y="194" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">−</text><text x="114" y="185" text-anchor="end" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">Vₜₕ = 10 V</text><path d="M150,130 L150,90 L260,90" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,90 h25 m0,-10 h50 v20 h-50 z m50,10 h25" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="68" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">Rₜₕ = 2 kΩ</text><path d="M360,90 L550,90 L550,130" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M550,130 v42 m-20,0 h40 m-40,16 h40 m-20,0 v42" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="187" text-anchor="end" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">C = 10 μF</text><path d="M550,230 L550,270 L150,270 L150,230" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="550" cy="90" r="4" fill="#274d43"/><text x="570" y="96" text-anchor="start" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">a</text><text x="570" y="276" text-anchor="start" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">b / 0</text><text x="550" y="55" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">uC(0⁺) = 2 V</text><text x="650" y="132" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">+</text><text x="650" y="187" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">uC</text><text x="650" y="236" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">−</text><text x="320" y="318" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16">换路后：R₁ = 3 kΩ、R₂ = 6 kΩ 已化为并联等效</text></svg>