<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img"><title>RC分段输入，时间轴与输入电压</title><rect width="100%" height="100%" fill="#fbfaf5" rx="12"/><path d="M90,220 L690,220" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,220 L90,35" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,220 L90,80 L330,80 L330,220 L650,220" fill="none" stroke="#274d43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="65" y="85" text-anchor="end" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">6 V</text><text x="65" y="225" text-anchor="end" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">0</text><text x="330" y="247" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">T = 20 ms</text><text x="690" y="247" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">t</text><text x="180" y="50" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17">vₛ(t)</text><text x="470" y="120" text-anchor="middle" fill="#213e35" font-family="Arial,Microsoft YaHei,sans-serif" font-size="18">uC 连续；在 t = T 重新起算</text></svg>