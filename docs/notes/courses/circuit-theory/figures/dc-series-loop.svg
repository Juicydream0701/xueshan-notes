<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">12 V电源串联2欧姆和4欧姆电阻</title><desc id="desc">左支路为上正下负12伏电源，顶部串联2欧姆和4欧姆电阻，右侧导线返回底部。顺时针电流2安培。</desc><rect width="760" height="330" rx="16" fill="#fbf8f0"/><g stroke="#285f57" stroke-width="3" fill="none" stroke-linecap="round"><path d="M120 125V85H245 M335 85H450 M540 85H650V260H120V205"/><circle cx="120" cy="165" r="40"/><rect x="245" y="70" width="90" height="30"/><rect x="450" y="70" width="90" height="30"/><path d="M110 151H130 M120 141V161 M110 181H130"/><path d="M177 47H217 M208 40L217 47L208 54"/></g><g fill="#285f57" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" text-anchor="middle"><text x="290" y="54">R₁ = 2 Ω</text><text x="495" y="54">R₂ = 4 Ω</text><text x="52" y="170">12 V</text><text x="192" y="30">i = 2 A</text><text x="290" y="130">+ u₁ = 4 V −</text><text x="495" y="130">+ u₂ = 8 V −</text><text x="385" y="305">关联方向：电流从电阻电压正端流入</text></g></svg>
