{% extends "base.html" %}
{% block title %}编辑 {{ name }} · 雪山资料库{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
<section class="editor">
  <a class="crumb" href="{{ url_for('view_file', rel=rel) }}">← 返回笔记</a>
  <div class="eyebrow">EDIT MARKDOWN</div><h1>{{ name }}</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <textarea name="content" spellcheck="false" required>{{ content }}</textarea>
    <div class="editor-actions"><a class="outline" href="{{ url_for('view_file', rel=rel) }}">取消</a><button class="primary" type="submit">保存修改</button></div>
  </form>
</section>
{% endblock %}
