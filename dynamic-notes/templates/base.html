<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}雪山资料库{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}">
</head>
<body>
  <header class="top"><a class="brand" href="{{ url_for('index') }}"><span class="brand-icon">雪</span><span>雪山资料库<small>PERSONAL KNOWLEDGE LIBRARY</small></span></a>
    <nav><a href="{{ url_for('index') }}">公开资料</a>{% if admin %}<a class="admin-tag" href="{{ url_for('index') }}">管理模式</a><form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="nav-button">退出</button></form>{% else %}<a class="login-link" href="{{ url_for('login') }}">管理员登录</a>{% endif %}</nav>
  </header>
  <main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
  <footer>雪山大地 · 个人学习资料空间</footer>
</body>
</html>
